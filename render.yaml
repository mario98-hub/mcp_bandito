# Render Blueprint — one-click-ish deploy of the Conti MCP server, all from the browser.
#
# How to use:
#   1. Create a Turso database in the Turso dashboard and generate a token (no CLI needed).
#   2. On Render: New → Blueprint → connect this repo. Render reads this file.
#   3. Fill the two Turso values when prompted; CONTI_TOKEN is generated for you.
#   4. After deploy, open the service → Environment, copy the generated CONTI_TOKEN,
#      and add the connector URL  https://<app>.onrender.com/mcp/<CONTI_TOKEN>  in Claude/ChatGPT.
#
# Free plan note: the service sleeps after ~15 min idle and takes ~1 min to wake.
# Data lives in Turso, so sleeping/redeploying never loses anything.
services:
  - type: web
    name: conti-mcp
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # MCP connector secret — generated by Render; read it back from the Environment tab.
      - key: CONTI_TOKEN
        generateValue: true
      # Turso database URL, e.g. libsql://conti-<you>.turso.io
      - key: CONTI_DB
        sync: false
      # Turso auth token (keep secret)
      - key: CONTI_DB_AUTH_TOKEN
        sync: false
